name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o gh-issuefs-linux-amd64 ./cmd/gh-issuefs

      - name: Build Darwin AMD64
        run: GOOS=darwin GOARCH=amd64 go build -o gh-issuefs-darwin-amd64 ./cmd/gh-issuefs

      - name: Build Darwin ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o gh-issuefs-darwin-arm64 ./cmd/gh-issuefs

      - name: Build Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o gh-issuefs-windows-amd64.exe ./cmd/gh-issuefs

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gh-issuefs-linux-amd64
            gh-issuefs-darwin-amd64
            gh-issuefs-darwin-arm64
            gh-issuefs-windows-amd64.exe
